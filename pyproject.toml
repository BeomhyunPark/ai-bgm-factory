[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bgm-factory"
version = "0.1.0"
description = "Offline, test-only instrumental video pipeline"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.1,<13", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bgm = "ai_bgm_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_bgm_factory = ["schemas/*.json", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = ["smoke: full 60-minute acceptance run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
